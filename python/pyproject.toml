[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cytogater"
version = "0.1.1"
description = "Python implementation of cytoGateR marker-aware cell annotation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-only"}
dependencies = [
  "anndata>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "seaborn>=0.13"]
torch = ["torch>=2.1"]
notebook = ["ipykernel>=6", "jupyterlab>=4", "nbclient>=0.10"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the shared PRJ-cytogater data and runs for ~1 minute per dataset",
]
