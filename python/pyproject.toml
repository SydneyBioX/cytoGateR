[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cytogater"
version = "0.1.3"
description = "Python implementation of cytoGateR marker-aware cell annotation"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
  {name = "Matthew Li"},
  {name = "Harry Robertson"},
  {name = "Nikhil Karthik"},
  {name = "Jean Yang"},
  {name = "Lijia Yu"},
]
maintainers = [
  {name = "Lijia Yu", email = "yulj2010@gmail.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "seaborn>=0.13"]
torch = ["torch>=2.1"]
notebook = ["ipykernel>=6", "jupyterlab>=4", "nbclient>=0.10"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/SydneyBioX/cytoGateR"
Repository = "https://github.com/SydneyBioX/cytoGateR"
Issues = "https://github.com/SydneyBioX/cytoGateR/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the shared PRJ-cytogater data and runs for ~1 minute per dataset",
]
